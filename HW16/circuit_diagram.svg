<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="820" viewBox="0 0 1300 820">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #1f2933; }
      .label { font: 18px Arial, sans-serif; fill: #1f2933; }
      .small { font: 15px Arial, sans-serif; fill: #334155; }
      .pin { font: 14px Arial, sans-serif; fill: #0f172a; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
      .note { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 8; }
      .wire { fill: none; stroke: #2563eb; stroke-width: 3; }
      .power { fill: none; stroke: #dc2626; stroke-width: 3; }
      .ground { fill: none; stroke: #111827; stroke-width: 3; }
      .motor { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 22; }
      .sensor { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 8; }
      .driver { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 8; }
      .battery { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 8; }
    </style>
  </defs>

  <text x="40" y="52" class="title">HW16 Current Control Circuit - NUCLEO-C092RC</text>
  <text x="40" y="82" class="small">All grounds are common: Nucleo GND, DRV8833 GND, INA219 GND, and 4xAA battery GND.</text>

  <rect x="55" y="140" width="300" height="505" class="box"/>
  <text x="83" y="180" class="label">NUCLEO-C092RC</text>
  <text x="83" y="215" class="pin">3V3</text>
  <text x="83" y="250" class="pin">GND</text>
  <text x="83" y="300" class="pin">PA0 / ADC1_IN0</text>
  <text x="83" y="355" class="pin">PA8 / TIM1_CH1 PWM</text>
  <text x="83" y="395" class="pin">PA1 / TIM1_CH2 PWM</text>
  <text x="83" y="455" class="pin">PA6 / I2C2_SDA</text>
  <text x="83" y="495" class="pin">PA7 / I2C2_SCL</text>
  <text x="83" y="555" class="pin">USB VCP serial</text>

  <rect x="505" y="155" width="260" height="245" class="driver"/>
  <text x="540" y="193" class="label">DRV8833</text>
  <text x="525" y="235" class="pin">nSLEEP / EEP</text>
  <text x="525" y="270" class="pin">GND</text>
  <text x="525" y="305" class="pin">VM / VCC</text>
  <text x="525" y="345" class="pin">IN1 tied to IN3</text>
  <text x="525" y="380" class="pin">IN2 tied to IN4</text>
  <text x="675" y="345" class="pin">OUT1 tied to OUT3</text>
  <text x="675" y="380" class="pin">OUT2 tied to OUT4</text>

  <rect x="965" y="170" width="245" height="115" class="motor"/>
  <text x="1030" y="220" class="label">RC Servo DC Motor</text>
  <text x="1002" y="252" class="small">Use motor leads only</text>

  <rect x="835" y="325" width="255" height="190" class="sensor"/>
  <text x="890" y="365" class="label">INA219</text>
  <text x="855" y="405" class="pin">VIN+</text>
  <text x="855" y="440" class="pin">VIN-</text>
  <text x="855" y="475" class="pin">VCC, GND</text>
  <text x="985" y="405" class="pin">SDA</text>
  <text x="985" y="440" class="pin">SCL</text>

  <rect x="540" y="535" width="220" height="130" class="battery"/>
  <text x="586" y="580" class="label">4xAA Pack</text>
  <text x="585" y="615" class="pin">+6 V to DRV8833 VM</text>
  <text x="585" y="645" class="pin">GND to common GND</text>

  <rect x="930" y="575" width="235" height="145" class="box"/>
  <text x="982" y="615" class="label">Servo Pot</text>
  <text x="955" y="655" class="pin">End 1: 3V3</text>
  <text x="955" y="685" class="pin">Wiper: PA0 ADC</text>
  <text x="955" y="715" class="pin">End 2: GND</text>

  <rect x="390" y="690" width="445" height="82" class="note"/>
  <text x="415" y="725" class="small">Motor current path: DRV OUT1/OUT3 -> motor -> INA219 VIN+ -> shunt -> VIN- -> DRV OUT2/OUT4.</text>
  <text x="415" y="752" class="small">PWM off state is both DRV inputs high. Never command both bridge inputs low.</text>

  <path d="M355 212 H505" class="power"/>
  <text x="382" y="203" class="small">3V3 to DRV nSLEEP/EEP</text>
  <path d="M355 248 H505" class="ground"/>
  <text x="382" y="241" class="small">common GND</text>
  <path d="M355 352 H505" class="wire"/>
  <text x="378" y="343" class="small">PA8 PWM -> IN1/IN3</text>
  <path d="M355 392 H505" class="wire"/>
  <text x="378" y="415" class="small">PA1 PWM -> IN2/IN4</text>

  <path d="M760 305 H540 V535" class="power"/>
  <text x="665" y="525" class="small">+6 V</text>
  <path d="M650 665 V700 H320 V248" class="ground"/>
  <text x="410" y="688" class="small">battery GND to common GND</text>

  <path d="M355 212 H930" class="power"/>
  <path d="M355 248 H930" class="ground"/>
  <path d="M355 300 H900 V685 H930" class="wire"/>
  <text x="650" y="292" class="small">PA0 reads pot wiper</text>

  <path d="M355 455 H985" class="wire"/>
  <path d="M355 495 H985" class="wire"/>
  <text x="560" y="447" class="small">PA6 I2C2_SDA</text>
  <text x="560" y="487" class="small">PA7 I2C2_SCL</text>
  <path d="M1090 475 H1160 V248 H355" class="ground"/>
  <path d="M835 475 H790 V212 H355" class="power"/>

  <path d="M765 345 H930 V228 H965" class="wire"/>
  <path d="M1210 228 H1240 V405 H1090" class="wire"/>
  <path d="M835 440 H785 V380 H765" class="wire"/>
  <path d="M835 405 H1240" class="wire"/>
  <text x="788" y="332" class="small">OUT1/OUT3</text>
  <text x="790" y="374" class="small">OUT2/OUT4</text>
</svg>
